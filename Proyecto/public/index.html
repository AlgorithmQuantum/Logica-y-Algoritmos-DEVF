<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Notas Personales</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Gestor de Notas</h1>
      <p>Organiza tus ideas de forma sencilla</p>
    </header>

    <main>
      <!-- Mensajes de error/éxito -->
      <div id="mensaje" class="mensaje" style="display: none;"></div>

      <!-- Formulario para crear nueva nota -->
      <section class="form-section">
        <h2>➕ Crear nueva nota</h2>
        <form id="formNota">
          <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required placeholder="Ej: Compras del supermercado">
          </div>
          <div class="campo">
            <label for="contenido">Contenido</label>
            <textarea id="contenido" rows="3" required placeholder="Escribe aquí el detalle..."></textarea>
          </div>
          <button type="submit">💾 Guardar nota</button>
        </form>
      </section>

      <!-- Listado de notas -->
      <section class="list-section">
        <h2>📋 Mis notas</h2>
        <div id="listaNotas" class="lista-notas">
          <p class="cargando">Cargando notas...</p>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2025 Gestor de Notas · Almacenamiento local en JSON</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
